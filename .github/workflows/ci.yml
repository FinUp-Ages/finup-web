name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Testes com cobertura: reprova abaixo do piso de 85% (vitest.config.ts).
      - run: npm run test:coverage
      - run: npm run build
